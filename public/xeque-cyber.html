<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>XEQUE // CYBER — OSCP Study Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050308;
    --void-2:#0c0a16;
    --void-3:#13101f;
    --cyan:#00fff0;     /* Blue team / defense */
    --magenta:#ff00aa;  /* Red team / attack */
    --gold:#ffe600;     /* Crown Jewel / objective / correct */
    --danger:#ff3b3b;   /* damage / breach */
    --ash:#7a7790;
    --ash-2:#a9a6c0;
    --ink:#e9e7f5;
    --line:rgba(0,255,240,.14);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:'Chakra Petch',var(--mono);
    --team:var(--magenta); /* color of the active side, swapped via JS */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(255,0,170,.07), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(0,255,240,.06), transparent 60%),
      var(--void);
    color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* scanlines / CRT */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
    mix-blend-mode:multiply;opacity:.5;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}

  /* ---------- header ---------- */
  header.top{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;justify-content:space-between;
    border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0}
  .brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--ash);text-transform:uppercase}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:clamp(22px,4.4vw,34px);margin:0;line-height:1;
    letter-spacing:.02em;}
  .brand h1 .slash{color:var(--gold);-webkit-text-fill-color:var(--gold)}
  .brand .sub{font-size:12px;color:var(--ash-2);letter-spacing:.04em;margin-top:4px}

  .modeswap{display:flex;gap:8px;align-items:center}
  .modeswap .lbl{font-size:10px;letter-spacing:.28em;color:var(--ash);text-transform:uppercase;margin-right:2px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--void-2)}
  .seg button{font-family:var(--disp);font-weight:600;letter-spacing:.12em;font-size:13px;color:var(--ash-2);
    background:transparent;border:0;padding:9px 16px;cursor:pointer;transition:.18s}
  .seg button.red.on{background:rgba(255,0,170,.16);color:#ffb9e6;box-shadow:inset 0 0 0 1px var(--magenta),0 0 18px rgba(255,0,170,.25)}
  .seg button.blue.on{background:rgba(0,255,240,.14);color:#aafff8;box-shadow:inset 0 0 0 1px var(--cyan),0 0 18px rgba(0,255,240,.22)}
  .seg button:not(.on):hover{color:var(--ink)}

  /* ---------- bars ---------- */
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px}
  .bar{background:var(--void-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .bar .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .bar .name{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
  .bar .val{font-family:var(--disp);font-weight:700;font-size:14px}
  .track{height:7px;border-radius:6px;background:#1a1726;overflow:hidden}
  .fill{height:100%;width:0;border-radius:6px;transition:width .55s cubic-bezier(.4,1.2,.4,1)}
  .fill.good{background:linear-gradient(90deg,var(--cyan),var(--gold))}
  .fill.doom{background:linear-gradient(90deg,#8a1f55,var(--danger))}

  /* ---------- layout ---------- */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);gap:20px;align-items:start}
  @media(max-width:880px){.stage{grid-template-columns:1fr}.bars{grid-template-columns:1fr 1fr}}

  .boardpanel{background:linear-gradient(180deg,var(--void-2),var(--void));border:1px solid var(--line);
    border-radius:16px;padding:14px;position:relative;overflow:hidden}
  .boardpanel .chainrail{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
  .node{flex:1 1 auto;min-width:0;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ash);
    border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:.3s;background:var(--void-3)}
  .node.done{color:var(--void);background:var(--team);border-color:var(--team);font-weight:700;
    box-shadow:0 0 12px color-mix(in srgb,var(--team) 60%,transparent)}
  .node.active{color:var(--gold);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 14px rgba(255,230,0,.3)}
  canvas#board{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation}
  .boardpanel.shake{animation:glitch .4s steps(3)}
  @keyframes glitch{0%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(3px,-3px)}
    60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,3px)}100%{transform:translate(0,0)}}

  /* ---------- console ---------- */
  .console{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--void-2);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .tag{font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:3px 7px;border-radius:999px;
    border:1px solid var(--line);color:var(--ash-2)}
  .tag.stage{border-color:var(--team);color:var(--team); display: inline-block;}
  .tag.mitre{border-color:rgba(255,230,0,.4);color:var(--gold)}
  .card h2{font-family:var(--disp);font-weight:600;font-size:16px;margin:0 0 6px;letter-spacing:.01em;color:var(--ink)}
  .card .situation{font-size:13px;line-height:1.6;color:var(--ash-2)}
  .card .situation b{color:var(--ink);font-weight:600}

  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    background:var(--void-3);border:1px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer;
    color:var(--ash-2);font-family:var(--mono);font-size:13px;line-height:1.5;transition:.16s}
  .choice:hover{border-color:var(--team);color:var(--ink);transform:translateX(2px)}
  .choice .k{font-family:var(--disp);font-weight:700;color:var(--team);flex:0 0 auto;
    width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--team);border-radius:6px;font-size:12px}
  .choice:disabled{cursor:default;transform:none;opacity:.85}
  .choice.correct{border-color:var(--gold);background:rgba(255,230,0,.08);color:var(--ink)}
  .choice.correct .k{color:var(--gold);border-color:var(--gold)}
  .choice.wrong{border-color:var(--danger);background:rgba(255,59,59,.08)}
  .choice.wrong .k{color:var(--danger);border-color:var(--danger)}

  .feedback{border-left:2px solid var(--team);padding:11px 0 4px 14px;display:none}
  .feedback.show{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .feedback .verdict{font-family:var(--disp);font-weight:700;letter-spacing:.08em;font-size:13px;margin-bottom:6px;text-transform:uppercase}
  .feedback.ok .verdict{color:var(--gold)}
  .feedback.bad .verdict{color:var(--danger)}
  .feedback .verdict::before{content:"▚ ";opacity:.7}
  .feedback .txt{font-size:12.5px;line-height:1.62;color:var(--ash-2)}
  .feedback .txt b{color:var(--ink)}
  .feedback .ref{margin-top:9px;font-size:10.5px;color:var(--ash);letter-spacing:.02em}
  .feedback .ref b{color:var(--ash-2)}

  .next{margin-top:12px;width:100%;font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--void);background:var(--team);border:0;border-radius:10px;padding:12px;cursor:pointer;
    transition:.16s;box-shadow:0 0 22px color-mix(in srgb,var(--team) 45%,transparent)}
  .next:hover{filter:brightness(1.12)}
  .next.hidden{display:none}

  /* ---------- end overlay ---------- */
  .overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;
    background:rgba(5,3,8,.86);backdrop-filter:blur(6px)}
  .overlay.show{display:grid;animation:fade .35s ease}
  .endcard{max-width:520px;width:100%;background:var(--void-2);border:1px solid var(--team);border-radius:18px;
    padding:26px;text-align:center;box-shadow:0 0 60px color-mix(in srgb,var(--team) 30%,transparent)}
  .endcard .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
  .endcard h2{font-family:var(--disp);font-weight:700;font-size:clamp(24px,6vw,38px);margin:8px 0 6px;letter-spacing:.02em}
  .endcard.win h2{color:var(--gold)}
  .endcard.lose h2{color:var(--danger)}
  .endcard p{font-size:13px;line-height:1.6;color:var(--ash-2);margin:0 0 18px}
  .endcard p b{color:var(--ink)}
  .endbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .endbtns button{font-family:var(--disp);font-weight:600;letter-spacing:.1em;font-size:13px;cursor:pointer;
    border-radius:10px;padding:11px 18px;border:1px solid var(--line);background:var(--void-3);color:var(--ink);transition:.16s}
  .endbtns button.primary{background:var(--team);color:var(--void);border-color:var(--team)}
  .endbtns button:hover{filter:brightness(1.12)}

  footer{text-align: center; margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:11px;color:var(--ash);line-height:1.7}
  footer b{color:var(--ash-2)}
  footer .refs{margin-top:6px}

  .hud{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ash);letter-spacing:.06em;margin:2px 0 12px}
  .hud b{color:var(--team);font-family:var(--disp)}
  .restart-mini{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--ash-2);
    border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.08em}
  .restart-mini:hover{border-color:var(--team);color:var(--ink)}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
    body::after{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="kicker">encodere.se · study room</span>
      <h1>XEQUE <span class="slash">//</span> CYBER</h1>
      <span class="sub">Choose your side and hold your position in the game!</span>
    </div>
    <div class="modeswap">
      <span class="lbl">Side</span>
      <div class="seg" role="tablist" aria-label="Side selection">
        <button class="red on" id="btnRed" role="tab" aria-selected="true">▲ RED · OSCP</button>
        <button class="blue" id="btnBlue" role="tab" aria-selected="false">▼ BLUE · SOC</button>
      </div>
    </div>
  </header>

  <div class="bars">
    <div class="bar">
      <div class="row"><span class="name" id="goodName">Access</span><span class="val" id="goodVal">0%</span></div>
      <div class="track"><div class="fill good" id="goodFill"></div></div>
    </div>
    <div class="bar">
      <div class="row"><span class="name" id="doomName">Detection</span><span class="val" id="doomVal">0%</span></div>
      <div class="track"><div class="fill doom" id="doomFill"></div></div>
    </div>
  </div>

  <div class="hud">
    <span>OPERATION: <b id="opName">INTRUSION</b></span>
    <span>PHASE <b id="turnNum">1</b>/<b id="turnTot">18</b></span>
    <button class="restart-mini" id="restartMini">↺ restart operation</button>
  </div>

  <div class="stage">
    <section class="boardpanel" id="boardPanel" aria-label="Tactical board">
      <div class="chainrail" id="chainRail"></div>
      <canvas id="board" width="640" height="640" aria-hidden="true"></canvas>
    </section>

    <section class="console" id="console" aria-live="polite"></section>
  </div>

  <footer class="footer">
    <div class="refs">All rights reserved · encodere.se </div>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="endcard" id="endCard">
    <span class="eyebrow" id="endEyebrow">result</span>
    <h2 id="endTitle">—</h2>
    <p id="endBody">—</p>
    <div class="endbtns">
      <button class="primary" id="endAgain">New operation</button>
      <button id="endSwap">Switch sides</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   XEQUE // CYBER — game engine
   Path B: kill chain as a path on the chessboard.
   ============================================================ */

/* ---------- DECKS ---------- */
/* Each node: stage (short rail label), title, mitre, situation,
   options[3], correct (index), okFeed, badFeed, ref, role (defending piece) */

const RED_DECK = [
  {
    stage:"Recon", role:"pawn",
    title:"Cold target: 10.10.x.x",
    mitre:"TA0043 · Reconnaissance",
    situation:"You get an IP and nothing else. The urge is to open Metasploit and look for a ready-made exploit. <b>What's the first move?</b>",
    options:[
      "Run a full nmap: <b>-p- </b>then <b>-sC -sV</b> on the open ports, in the background while already poking 80/443/445 by hand.",
      "Search searchsploit for the OS name and fire off the first exploit that matches.",
      "Use a single <b>nmap -F</b> (top 100) and move on, to save time."
    ],
    correct:0,
    okFeed:"Enumeration before exploitation. You scan <b>all</b> 65535 ports (-p-), then dig deeper only into the open ones. And you don't sit watching the script finish: you attack 80/443/445 manually in parallel — most exam failures come from an <b>obvious port 80 being ignored</b> while waiting on automation.",
    badFeed:"Haste is the enemy. Jumping to an exploit without a map, or scanning only the top 100, is like making your first move without looking at the whole board — a forgotten high port (8080, 8443, 5985) is where the foothold lives.",
    ref:"OSCP: insufficient enumeration is the #1 cause of failure. Run automation in the background, but poke high-value ports by hand."
  },
  {
    stage:"Services", role:"pawn",
    title:"Live ports: 80, 445, 5985",
    mitre:"TA0007 · Discovery",
    situation:"The scan is back: HTTP (80), SMB (445), and WinRM (5985). <b>How do you widen the attack surface?</b>",
    options:[
      "Just fuzz directories on port 80 — web is usually the shortest path.",
      "Enumerate <b>in parallel</b>: feroxbuster/gobuster on 80, <b>enum4linux-ng</b> and <b>smbclient -L</b> on 445, and save 5985 for when you have a credential.",
      "Try anonymous login on WinRM first, since it gives a direct shell."
    ],
    correct:1,
    okFeed:"Each service is a different diagonal on the board. SMB can leak anonymous shares, usernames, version; web can have upload or LFI; WinRM (5985) turns into a shell <b>once</b> you already have a credential. Breadth of enumeration beats premature depth.",
    badFeed:"Tunnel-visioning on a single service leaves material on the table. WinRM has no useful 'anonymous login' — it expects a valid credential. Enumerate all three; the foothold is rarely where you bet first.",
    ref:"enum4linux-ng / smbclient / crackmapexec for SMB; feroxbuster for web. WinRM = post-credential (evil-winrm)."
  },
  {
    stage:"Web foothold", role:"bishop",
    title:"Upload that accepts too much",
    mitre:"TA0001 · Initial Access",
    situation:"The web app has an image upload form. The filter blocks <b>.php</b>, but you suspect it's weak. <b>How do you turn this into RCE?</b>",
    options:[
      "Give up on the upload and go hunt for SQL injection on the login.",
      "Test extension bypasses (<b>.phtml, .php5, .pHp</b>, double extension, forged content-type) to upload a webshell and gain execution.",
      "Upload a .txt with PHP code and hope the server executes it."
    ],
    correct:1,
    okFeed:"A weak extension filter = an unlocked door. You test variants the server still interprets as PHP (.phtml/.php5), uppercase, double extension (shell.php.jpg), and a forged Content-Type. A minimal webshell already gives you <b>command execution</b> — your foot in the door.",
    badFeed:"Abandoning the right lead to chase a rabbit hole (SQLi where the input is the upload) is like trading an advanced piece for nothing. A .txt isn't interpreted as code. When the upload is the vector, persist with the bypass.",
    ref:"Upload bypass: alternative extensions, double extension, magic bytes, Content-Type. See HackTricks 'File Upload'."
  },
  {
    stage:"JWT bypass", role:"bishop",
    title:"An internal API trusts its own token",
    mitre:"TA0001 · Initial Access (JWT)",
    situation:"While the web upload gives you RCE, a second endpoint catches your eye: an internal API that authenticates with a JWT. Decoding the token, the header shows <b>\"alg\":\"HS256\"</b>. <b>How do you test it?</b>",
    options:[
      "Forge a new payload with an admin claim and re-sign it with a random secret.",
      "Change <b>alg</b> to <b>none</b> and strip the signature — some libraries still accept an unsigned token if the field isn't validated server-side.",
      "Give up — you already have RCE from the upload, no need to touch the API."
    ],
    correct:1,
    okFeed:"Algorithm confusion is a classic JWT flaw: some verification libraries trust the <b>alg</b> field from the token itself. Set it to <b>none</b>, drop the signature, and if the server skips verification, you walk in as whichever claims you wrote — often exposing credentials or config the upload vector never touched.",
    badFeed:"Re-signing with a guessed secret only works if you already have (or brute-force) the real key — it's not the first thing to try. And 'I already have RCE' is exactly the tunnel vision that makes you miss adjacent low-hanging fruit; the exam rewards squeezing every exposed surface, not stopping at the first shell.",
    ref:"JWT alg:none / algorithm confusion. Check with jwt_tool or manually via jwt.io. OWASP JWT Cheat Sheet."
  },
  {
    stage:"XXE", role:"bishop",
    title:"An XML import that reads more than it should",
    mitre:"TA0009 · Collection (XXE)",
    situation:"A file-import feature accepts XML. Nothing in the response reflects your input directly, but the app clearly parses the document. <b>Where do you look for a primitive?</b>",
    options:[
      "Try SQL injection on the same field instead — XML is a dead end without reflected output.",
      "Declare an external entity pointing at <b>file:///etc/passwd</b> and reference it inside the payload — even a blind response (error-based or out-of-band) can confirm the read.",
      "Assume the parser is safe by default and move to another endpoint."
    ],
    correct:1,
    okFeed:"You don't need the file to appear on screen to prove XXE. Declaring <code>&lt;!ENTITY xxe SYSTEM \"file:///etc/passwd\"&gt;</code> and referencing <code>&xxe;</code> can leak data through an error message, a delayed response, or an out-of-band DNS/HTTP callback — enough to confirm arbitrary file read even when the app looks silent.",
    badFeed:"SQL injection is a different vulnerability class; a parser that clearly consumes an XML body deserves an XML-specific test first. And most modern parsers only disable external entities if someone explicitly configured it — assuming safety by default is how XXE gets missed in reports.",
    ref:"XXE: external entity + out-of-band exfiltration when blind. See HackTricks 'XXE' and OWASP XXE Prevention Cheat Sheet."
  },
  {
    stage:"Stable shell", role:"pawn",
    title:"Reverse shell — but dumb",
    mitre:"TA0002 · Execution",
    situation:"The webshell gave you a reverse shell, but it's a broken TTY: no history, no tab, Ctrl-C kills everything. <b>Next step before any enumeration?</b>",
    options:[
      "Just run <b>sudo -l</b> and linpeas right away, no time to lose.",
      "<b>Stabilize the shell</b>: spawn a PTY (python3 pty), <b>export TERM=xterm</b>, and <b>stty raw -echo; fg</b> to get a fully interactive terminal.",
      "Reconnect several times hoping a better shell comes along."
    ],
    correct:1,
    okFeed:"An unstable shell makes you lose the session mid privesc exploit — an expensive time loss during the exam. You do the upgrade: <code>python3 -c 'import pty;pty.spawn(\"/bin/bash\")'</code>, then <b>Ctrl-Z → stty raw -echo; fg → export TERM=xterm</b>. Now you have Ctrl-C, arrow keys, and tab.",
    badFeed:"Running privesc in a broken shell is a recipe for freezing and dropping at the worst moment. Stabilize <b>first</b>: it's the equivalent of castling the king before opening the game.",
    ref:"PTY upgrade: pty.spawn + stty raw -echo + fg. Essential before privesc."
  },
  {
    stage:"Local enum", role:"knight",
    title:"On your feet on the box — now what?",
    mitre:"TA0007 · Discovery",
    situation:"You're www-data on a Linux box. The temptation is to download a kernel exploit and detonate it. <b>How do you conduct privesc enumeration?</b>",
    options:[
      "Look up the kernel version on Google and run the first public PoC.",
      "Enumerate methodically: <b>sudo -l</b>, SUID/SGID, cron, capabilities, files with credentials, writable paths — aided by linpeas, but reading the output.",
      "Try changing root's password directly, since you have a shell."
    ],
    correct:1,
    okFeed:"A kernel exploit is a last resort: unstable, it can crash the box (and your session) right in front of the proctor. The clean path is misconfiguration: <b>sudo -l</b>, SUID binaries, writable cron jobs, capabilities, passwords in config/history. linpeas speeds things up, but <b>you</b> interpret the output.",
    badFeed:"A random kernel PoC = a piece sacrificed for nothing: it crashes the target, doesn't compile, or is a time honeypot. Misconfiguration is quiet and reliable. Read linpeas' output, don't just run it.",
    ref:"linpeas/pspy + manual checks. Kernel exploit last. GTFOBins for SUID/sudo."
  },
  {
    stage:"Privesc", role:"rook",
    title:"sudo -l reveals a GTFOBin",
    mitre:"TA0004 · Privilege Escalation",
    situation:"<b>sudo -l</b> shows you can run <b>/usr/bin/find</b> as root with no password. <b>What's the play?</b>",
    options:[
      "Use the <b>GTFOBins</b> technique: <code>sudo find . -exec /bin/sh \\; -quit</code> to become root.",
      "Download a kernel exploit anyway, just to be safe.",
      "Copy /etc/shadow with find and try to crack all the hashes offline."
    ],
    correct:0,
    okFeed:"<b>find</b> with sudo is a classic GTFOBin: <code>-exec</code> runs a shell <b>as root</b>. You just promoted the piece — from www-data to crown. Every binary allowed in sudo -l has a cataloged technique; checking GTFOBins is the right reflex.",
    badFeed:"You already had check in one move and went looking for complications. Cracking shadow is slow and unnecessary when <code>-exec</code> gives you root instantly. A kernel exploit here is a free risk.",
    ref:"GTFOBins: find, vim, less, env, tar, etc. with sudo = instant root shell."
  },

  // generates n unique squares climbing the board; king stays fixed at top
  const cells=[];
  const king={c:4,r:0};
  // starting points at the bottom, winding upward
  let c=0,r=7;
  cells.push({c,r});
  const total=n;
  for(let i=1;i<total-1;i++){
    // gradually climbs and oscillates horizontally toward the king
    const t=i/(total-1);
    r = Math.max(1, Math.round(7 - t*6));
    const wave = Math.sin(i*1.05)*2.4;
    c = Math.min(7, Math.max(0, Math.round(2 + t*2 + wave)));
    // avoids exact repetition
    if(cells.some(x=>x.c===c&&x.r===r)) c=Math.min(7,c+1);
    cells.push({c,r});
  }
  cells.push(king);
  return cells;
}

/* chess glyphs by role */
const GLYPH={king:"♚",queen:"♛",rook:"♜",bishop:"♝",knight:"♞",pawn:"♟"};
const ROLE_EN={king:"DC · Crown Jewel",queen:"SOC/IR",rook:"Firewall",bishop:"SIEM/Det.",knight:"Hunter",pawn:"Endpoint"};

/* ---------- canvas render ---------- */
const cv=document.getElementById('board');
const ctx=cv.getContext('2d');
let DPR=Math.min(window.devicePixelRatio||1,2);

function sizeCanvas(){
  const w=cv.clientWidth||cv.parentElement.clientWidth-28;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*DPR);
  cv.height=Math.round(w*DPR);
  draw();
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function draw(){
  const S=cv.width, cell=S/8;
  ctx.clearRect(0,0,S,S);
  const teamCol=css(state.side==='red'?'--magenta':'--cyan');
  const enemyCol=css(state.side==='red'?'--cyan':'--magenta');
  const gold=css('--gold');

  // squares
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const dark=(r+c)%2===1;
    ctx.fillStyle=dark?'#0a0814':'#0f0c1c';
    ctx.fillRect(c*cell,r*cell,cell,cell);
  }
  // grid glow
  ctx.strokeStyle='rgba(0,255,240,.07)';ctx.lineWidth=1*DPR;
  for(let i=0;i<=8;i++){
    ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,S);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(S,i*cell);ctx.stroke();
  }

  // kill chain route (line between nodes)
  if(PATH.length){
    ctx.lineWidth=2.5*DPR;
    ctx.strokeStyle='rgba(255,230,0,.18)';
    ctx.setLineDash([6*DPR,6*DPR]);
    ctx.beginPath();
    PATH.forEach((p,i)=>{
      const x=p.c*cell+cell/2,y=p.r*cell+cell/2;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // pieces along the kill chain
  PATH.forEach((p,i)=>{
    if(i===PATH.length-1) return; // king drawn separately
    const role=state.deck[i]?state.deck[i].role:'pawn';
    const isActive = (i===state.idx);
    // "overrun": square already crossed by the attacker's advance front
    const overrun = state.side==='red' ? (i<state.pathProgress)
                                       : (i<state.enemyAdvance);
    // active node highlight
    if(isActive){
      ctx.save();
      ctx.shadowColor=gold;ctx.shadowBlur=22*DPR;
      ctx.strokeStyle=gold;ctx.lineWidth=2.5*DPR;
      ctx.strokeRect(p.c*cell+3*DPR,p.r*cell+3*DPR,cell-6*DPR,cell-6*DPR);
      ctx.restore();
    }
    // intact defense layer = cyan; fallen = gray
    const col = overrun ? '#4a4a5a' : (state.side==='red' ? enemyCol : teamCol);
    drawPiece(role,p.c*cell,p.r*cell,cell,col,gold,isActive);
  });

  // operative / advance front (magenta = attacker always)
  const attackerCol=css('--magenta');
  let opIdx;
  if(state.side==='red'){ opIdx=Math.min(state.pathProgress, PATH.length-2); }
  else { opIdx=Math.min(state.enemyAdvance, PATH.length-2); }
  if(PATH[opIdx]){
    const p=PATH[opIdx];
    const x=p.c*cell+cell/2, y=p.r*cell+cell/2;
    const t=performance.now()/600;
    const pulse = state.reduced?0:Math.sin(t)*2*DPR;
    ctx.save();
    ctx.shadowColor=attackerCol;ctx.shadowBlur=(18+pulse*3)*DPR;
    ctx.fillStyle=attackerCol;
    // "operation cursor" diamond
    const s=cell*0.16+pulse;
    ctx.beginPath();
    ctx.moveTo(x,y-cell*0.34);ctx.lineTo(x+s,y-cell*0.34+s);
    ctx.lineTo(x,y-cell*0.34+2*s);ctx.lineTo(x-s,y-cell*0.34+s);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // King / Jewel
  const king=PATH[PATH.length-1];
  if(king){
    const t=performance.now()/700;
    const pulse=state.reduced?0:(0.5+0.5*Math.sin(t));
    ctx.save();
    ctx.shadowColor=gold;ctx.shadowBlur=(16+pulse*20)*DPR;
    drawPiece('king',king.c*cell,king.r*cell,cell,gold,gold,true);
    ctx.restore();
  }
}

function drawPiece(role,x,y,cell,col,glow,active){
  const cx=x+cell/2, cy=y+cell/2;
  ctx.save();
  ctx.shadowColor=glow; ctx.shadowBlur=active?12*DPR:6*DPR;
  ctx.fillStyle=col;
  ctx.font=`${Math.round(cell*0.56)}px 'JetBrains Mono', monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(GLYPH[role]||'♟', cx, cy-cell*0.06);
  ctx.restore();
  // role label
  ctx.save();
  ctx.fillStyle='rgba(180,180,200,.6)';
  ctx.font=`${Math.round(cell*0.13)}px 'JetBrains Mono', monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ROLE_EN[role]||'', cx, cy+cell*0.34);
  ctx.restore();
}

/* smooth loop just for pulses */
function raf(){ if(!state.reduced){ draw(); } requestAnimationFrame(raf); }

/* ---------- UI / flow ---------- */
const el=id=>document.getElementById(id);
const consoleEl=el('console');

function setTeamVar(){
  document.documentElement.style.setProperty('--team', state.side==='red'?'var(--magenta)':'var(--cyan)');
}

function renderBars(){
  const cfg=CFG[state.side];
  el('goodName').textContent=cfg.goodName;
  el('doomName').textContent=cfg.doomName;
  el('goodVal').textContent=Math.round(state.good)+'%';
  el('doomVal').textContent=Math.round(state.doom)+'%';
  el('goodFill').style.width=state.good+'%';
  el('doomFill').style.width=state.doom+'%';
  el('opName').textContent=cfg.op;
  el('turnNum').textContent=Math.min(state.idx+1,state.deck.length);
  el('turnTot').textContent=state.deck.length;
}

function renderRail(){
  const rail=el('chainRail'); rail.innerHTML='';
  state.deck.forEach((d,i)=>{
    const n=document.createElement('div');
    n.className='node'+(i<state.idx?' done':'')+(i===state.idx?' active':'');
    n.textContent=(i+1)+'· '+d.stage;
    rail.appendChild(n);
  });
}

function renderCard(){
  const d=state.deck[state.idx];
  state.answered=false;
  consoleEl.innerHTML='';
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <div class="meta">
      <span class="tag stage">Phase ${state.idx+1} · ${d.stage}</span>
      <span class="tag mitre">${d.mitre}</span>
    </div>
    <h2>${d.title}</h2>
    <div class="situation">${d.situation}</div>
  `;
  const choices=document.createElement('div');
  choices.className='choices';
  d.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.innerHTML=`<span class="k">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
    b.onclick=()=>answer(i,b,choices);
    choices.appendChild(b);
  });
  const fb=document.createElement('div');
  fb.className='feedback'; fb.id='feedback';
  const next=document.createElement('button');
  next.className='next hidden'; next.id='nextBtn';
  next.textContent='Next move ▸';
  next.onclick=advance;

  consoleEl.appendChild(card);
  consoleEl.appendChild(choices);
  consoleEl.appendChild(fb);
  consoleEl.appendChild(next);
  renderRail(); renderBars(); draw();
}

function answer(i,btn,choicesWrap){
  if(state.answered) return;
  state.answered=true;
  const d=state.deck[state.idx];
  const ok = i===d.correct;
  // lock buttons
  [...choicesWrap.children].forEach((b,bi)=>{
    b.disabled=true;
    if(bi===d.correct) b.classList.add('correct');
    if(bi===i && !ok) b.classList.add('wrong');
  });
  // state effects
  if(ok){
    state.good=Math.min(100, state.good + (100/state.deck.length));
    if(state.side==='red'){ state.pathProgress=Math.min(state.deck.length, state.pathProgress+1); }
    else { /* blue holds: pushes the attacker back 1 node if possible */
      state.enemyAdvance=Math.max(0, state.enemyAdvance-1);
      state.pathProgress=Math.min(state.deck.length, state.pathProgress+1);
    }
  }else{
    if(state.side==='red'){ state.doom=Math.min(100, state.doom+34); } // 3 mistakes burn the op
    else { state.enemyAdvance+=1; state.doom=Math.min(100, state.doom+ (100/Math.max(1,state.deck.length-1)) ); }
    if(!state.reduced){ const bp=el('boardPanel'); bp.classList.remove('shake'); void bp.offsetWidth; bp.classList.add('shake'); }
  }
  // feedback
  const fb=el('feedback');
  fb.classList.add('show', ok?'ok':'bad');
  fb.innerHTML=`
    <div class="verdict">${ok?'Correct move':'Trap'}</div>
    <div class="txt">${ok?d.okFeed:d.badFeed}</div>
    <div class="ref"><b>Study:</b> ${d.ref}</div>
  `;
  renderBars(); draw();

  // check for immediate defeat
  const blueBreached = state.side==='blue' && state.enemyAdvance>=PATH.length-1;
  if(state.doom>=100 || blueBreached){ setTimeout(()=>endGame(false), 650); return; }
  el('nextBtn').classList.remove('hidden');
}

function advance(){
  // victory if reached the end
  if(state.idx>=state.deck.length-1){
    const won = state.doom<100;
    return endGame(won);
  }
  state.idx++;
  renderCard();
}

function endGame(win){
  const cfg=CFG[state.side];
  const ov=el('overlay'), card=el('endCard');
  card.className='endcard '+(win?'win':'lose');
  el('endEyebrow').textContent = win?'objective accomplished':'kill chain failed';
  el('endTitle').textContent = win?cfg.winTitle:cfg.loseTitle;
  el('endBody').innerHTML = win?cfg.winBody:cfg.loseBody;
  ov.classList.add('show');
}

/* ---------- mode control ---------- */
function startSide(side){
  state.side=side;
  state.deck = side==='red'?RED_DECK:BLUE_DECK;
  state.idx=0; state.good=0; state.doom=0; state.answered=false;
  state.pathProgress=0; state.enemyAdvance=0;
  if(side==='blue') state.enemyAdvance=0;
  PATH=buildPath(state.deck.length);
  setTeamVar();
  // visual toggle
  el('btnRed').classList.toggle('on', side==='red');
  el('btnBlue').classList.toggle('on', side==='blue');
  el('btnRed').setAttribute('aria-selected', side==='red');
  el('btnBlue').setAttribute('aria-selected', side==='blue');
  el('overlay').classList.remove('show');
  sizeCanvas();
  renderCard();
}

el('btnRed').onclick=()=>startSide('red');
el('btnBlue').onclick=()=>startSide('blue');
el('restartMini').onclick=()=>startSide(state.side);
el('endAgain').onclick=()=>startSide(state.side);
el('endSwap').onclick=()=>startSide(state.side==='red'?'blue':'red');

window.addEventListener('resize', sizeCanvas);

/* boot */
startSide('red');
raf();
</script>
</body>
